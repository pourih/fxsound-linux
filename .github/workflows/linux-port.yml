name: linux-port

on:
  push:
    branches: [linux]
  pull_request:
    branches: [linux, main]

jobs:
  fedora44:
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - name: Install build setup
        run: |
          dnf install -y gcc-c++ cmake ninja-build git pkgconf-pkg-config \
            pipewire-devel systemd-devel dbus-devel alsa-lib-devel \
            libX11-devel libXext-devel libXinerama-devel libXrandr-devel \
            libXcursor-devel libXcomposite-devel libXrender-devel \
            freetype-devel fontconfig-devel mesa-libGL-devel libcurl-devel \
            libasan libubsan gdb valgrind pipewire-utils wireplumber pulseaudio-utils
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure (Ninja)
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Golden + param-effect (skips if refs absent — needs Phase 4 Windows run)
        run: |
          python3 tools/golden/gen_inputs.py --dir /tmp/fx_inputs || true
          if [ -f tests/golden/manifest.json ] && ls tests/golden/refs/*.wav >/dev/null 2>&1; then
            ./build/dsp_cli --in /tmp/fx_inputs/pink_10s.wav --out /tmp/fx_out.wav --preset bin/x64/Factsoft/1.fac || exit 1
            python3 tests/compare_golden.py --manifest tests/golden/manifest.json --out-dir /tmp/fx_outdir || exit 1
            python3 tests/param_effect.py --dsp-cli ./build/dsp_cli --in /tmp/fx_inputs/pink_10s.wav --tmp /tmp/fx_param || exit 1
          else
            echo "golden refs absent — skipping (Phase 4 Windows run pending)"
          fi
      - name: ASan/UBSan dsp_cli smoke
        run: |
          cmake -S . -B build-asan -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" || exit 0
          cmake --build build-asan --target dsp_cli || echo "asan build UNVERIFIED"

  windows-shared:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Verify shared sources present (no Linux breakage signal)
        shell: pwsh
        run: |
          if (!(Test-Path "fxsound/Project/FxSound.sln")) { throw "FxSound.sln missing" }
          if (!(Test-Path "dsp/DfxDsp.vcxproj")) { throw "DfxDsp.vcxproj missing" }
          if (!(Test-Path "audiopassthru/audiopassthru.vcxproj")) { throw "audiopassthru.vcxproj missing" }
          Write-Host "Shared Windows solution files intact. Full MSBuild build is manual (needs JUCE at C:\JUCE + WDK)."
